name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    uses: jpurnell/quality-gate-swift/.github/workflows/quality-gate-reusable.yml@main
    with:
      checks: "all"
      # Three checkers depend on artifacts that deliberately do not exist in this
      # repository, and would fail in CI for reasons unrelated to code quality:
      #
      #   status        — reads project/master_plan.md, which is a symlink to the
      #                   private SwiftDeterminism-docs repo and is gitignored here
      #   consistency   — reads the org-judgement corpus by absolute local path
      #   memory-builder — writes to the local per-project memory directory
      #
      # Everything else runs. This is the exact configuration verified locally
      # before CI was introduced.
      exclude: "status consistency memory-builder"
